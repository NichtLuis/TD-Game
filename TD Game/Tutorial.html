<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link type="text/css" rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div style="position: relative; width: 1280px; height: 768px">
      <canvas
        id="backgroundCanvas"
        width="1280"
        height="768"
        style="position: absolute; z-index: 1"
      ></canvas>
      <canvas
        id="towerCanvas"
        width="1280"
        height="768"
        style="position: absolute; z-index: 2; background-color: transparent"
      ></canvas>
    </div>
    <script src="./src/Tutorial.js" type="module"></script>
    <audio id="backgroundMusic" autoplay loop controls>
      <source src="./Musik/Ingame_Music_1.wav" type="audio/wav">
      <source src="./Musik/Ingame_Music_2.wav" type="audio/wav">
      <source src="./Musik/Ingame_Music_3.wav" type="audio/wav">
      Browser does not support the audio element.
    </audio>
  </body>
</html>
