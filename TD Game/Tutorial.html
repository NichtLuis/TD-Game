<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link type="text/css" rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div class="container">
      <div style="position: relative; width: 1280px; height: 768px">
        <canvas
          id="backgroundCanvas"
          width="1280"
          height="768"
          style="position: absolute; z-index: 1"
        ></canvas>
        <canvas
          id="towerCanvas"
          width="1280"
          height="768"
          style="position: absolute; z-index: 2; background-color: transparent"
        ></canvas>
        <canvas
          id="enemyCanvas"
          width="1280"
          height="768"
          style="position: absolute; z-index: 3; background-color: transparent"
        ></canvas>
      </div>
      <div class="tower-selection">
        <div class="tower" id="tower1" data-tower-type="normal">
          <img src="./images/towerAnim/tesla/turm1.5.png" alt="Tower 1" />
          <ul class="tower-stats">
            <li>Cost: 10</li>
            <li>Damage: 2</li>
            <li>Fire Rate: 2/s</li>
            <li>Range: 300px</li>
          </ul>
        </div>
        <div class="tower" id="tower2" data-tower-type="cannon">
          <img
            src="./images/towerAnim/cannon/turm_vorne-removebg-preview.png"
            alt="Tower 2"
            stlye=" display flex; align-items: center; justify-content: center;"
          />
          <ul class="tower-stats">
            <li>Cost: 15</li>
            <li>Damage: 4</li>
            <li>Fire Rate: 0,5/s</li>
            <li>Range: 220px</li>
          </ul>
        </div>
        <div class="tower" id="tower3" data-tower-type="smg">
          <img
            src="./images/towerAnim/smg/tower2.png"
            alt="Tesla"
            stlye=" display flex; align-items: center; justify-content: center;"
          />
          <ul class="tower-stats">
            <li>Cost: 15</li>
            <li>Damage: 1</li>
            <li>Fire Rate: 4/s</li>
            <li>Range: 400px</li>
          </ul>
        </div>
      </div>
      <div
        id="money-display"
        style="font-size: 28px; color: #ffe066; font-weight: bold; margin: 20px"
      >
        💰 <span id="money-amount">100</span>
      </div>
    </div>
    <script src="./src/Tutorial.js" type="module"></script>
    <script>
      // Money UI update logic
      import("./src/Tutorial.js").then((module) => {
        setInterval(() => {
          if (window.playerMoney !== undefined) {
            document.getElementById("money-amount").textContent =
              window.playerMoney;
          }
        }, 100);
      });
    </script>
    <!-- hidden music, make sure to align correctly later -->
    <audio
      id="backgroundMusic"
      autoplay
      loop
      controls
      style="visibility: collapse"
    >
      <source
        src="./sounds/background_music/Ingame_Musik_final.wav"
        type="audio/wav"
      />
      Browser unterstützt keine Audiodateien.
    </audio>

    <div id="tower-menu" style="display: none; position: absolute">
      <button id="upgrade-btn">
        <img
          src="images/ui/upgrade_button.png"
          alt="Upgrade"
          style="width: 32px; height: 32px"
        />
      </button>
      <button id="sell-btn">
        <img
          src="images/ui/delete_button.png"
          alt="Sell"
          style="width: 32px; height: 32px"
        />
      </button>
    </div>
  </body>
</html>
